# eng-gates project config. PROTECTED: agents must not edit this file (guard.config fails if they do).
# Runner: python3 tools/eng-gates/gate.py {fast|full|doctor}

[gate]
base = "origin/main"          # "changed" means changed since merge-base with this ref
timeout = 900                 # seconds per check
strict = false                # true (or CI=1): a missing tool fails instead of skipping
# languages = ["rust", "python", "ts"]   # override auto-detection
ts_src = "src"                # what dependency-cruiser scans
# extra protected paths (beyond the built-in list):
protected = []
# paths where new suppressions are not reported (generated code, vendored code):
suppress_ignore = ["**/generated/**", "**/*_pb2.py", "**/*.gen.ts"]

[ub]                          # Uncle Bob's gates (ub-mode)
crap = 10                     # every changed function: CRAP below this
dry = 0.8                     # duplicate candidates at or above this similarity fail

[tools]
# ub_dir = "~/.local/share/eng-gates/ub"   # where crapper/, dryer/, mutator/ live
# pyright = ".venv/bin/pyright"            # pin any tool to a path

# ---- per-check overrides: enabled / tier / cmd / requires ----
# Ids: rust.fmt rust.clippy rust.test rust.deny rust.machete rust.semver rust.bench
#      py.format py.lint py.types py.test py.imports py.deps py.bench
#      ts.types ts.lint ts.test ts.deps ts.knip ts.size ts.bench
#      ub.crap ub.dry ub.mutate guard.config guard.suppress

