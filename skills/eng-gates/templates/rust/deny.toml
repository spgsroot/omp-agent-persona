# PROTECTED. cargo-deny: run `cargo deny check`. Field names follow recent cargo-deny;
# if your version rejects a key, run `cargo deny init` and copy the policy values over.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []                     # each entry: { id = "RUSTSEC-...", reason = "..." } — human decision only

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  # { name = "openssl", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
